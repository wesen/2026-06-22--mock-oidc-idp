schema_version: 1
name: jitsi
classification: production-shaped-local
description: Strict TinyIDP and Jitsi integration using the shared Caddy development authority.
origins:
  issuer: https://idp.localhost:8443
vault:
  tier: dev
  deployment: jitsi
  runtime_path: tiny-idp/dev/jitsi/runtime
  bootstrap_path: tiny-idp/dev/jitsi/bootstrap
  owner_login: admin@example.test
  pki_path: tiny-idp/dev/_shared/caddy-local/pki-storage
  caddyfile: examples/tinyidp-jitsi/Caddyfile
  integration_path: tiny-idp/dev/jitsi/integrations/jitsi
required_tools: [docker, vault, jq, base64]
required_paths:
  - examples/tinyidp-jitsi/compose.yaml
  - examples/tinyidp-jitsi/scripts/00-init-secrets.sh
runtime:
  kind: compose
  services:
    - name: jitsi-compose
      cwd: examples/tinyidp-jitsi
      command: [docker, compose, up, --build, --remove-orphans]
prepare:
  secrets-fetch: [python3, devctl/operations.py, --repo-root, ., --manifest, dev/environments/jitsi.yaml, secrets-fetch]
secret_material:
  target: examples/tinyidp-jitsi/runtime/secrets
  files:
    - {source: runtime, field: token_secret_b64, path: token.key, encoding: base64, minimum_bytes: 32}
    - {source: runtime, field: admin_auth_key_b64, path: admin-auth.key, encoding: base64, exact_bytes: 32}
    - {source: runtime, field: admin_action_key_b64, path: admin-action.key, encoding: base64, minimum_bytes: 32}
    - {source: runtime, field: invitation_lookup_key_b64, path: invitation-lookup.key, encoding: base64, exact_bytes: 32}
    - {source: runtime, field: email_challenge_key_b64, path: email-challenge.key, encoding: base64, exact_bytes: 32}
    - {source: bootstrap, field: owner_password, path: local-admin-password.txt, encoding: text, minimum_bytes: 16}
    - {source: bootstrap, field: policy_denied_password, path: local-policy-denied-password.txt, encoding: text, minimum_bytes: 16}
    - {source: integration, field: shared_secret, path: jitsi-shared-secret.key, encoding: text, minimum_bytes: 43}
    - {source: integration, field: jicofo_auth_password, path: jicofo-auth-password.key, encoding: text, minimum_bytes: 32}
    - {source: integration, field: jvb_auth_password, path: jvb-auth-password.key, encoding: text, minimum_bytes: 32}
commands:
  pki-export-root: [examples/tinyidp-jitsi/scripts/01-export-browser-ca.sh]
  smoke: [examples/tinyidp-jitsi/scripts/02-smoke.sh]
  browser-test: [examples/tinyidp-jitsi/scripts/03-browser-tests.sh]
  state-status: [dev/scripts/compose-state.sh, jitsi, examples/tinyidp-jitsi/compose.yaml, status]
  state-reset: [dev/scripts/compose-state.sh, jitsi, examples/tinyidp-jitsi/compose.yaml, reset]
